<svg xmlns="http://www.w3.org/2000/svg" width="900" height="296" viewBox="0 0 900 296">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="25%" stop-color="#feca57"/>
      <stop offset="50%" stop-color="#48dbfb"/>
      <stop offset="75%" stop-color="#5f27cd"/>
      <stop offset="100%" stop-color="#ff9ff3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="860" height="256" rx="24" fill="url(#bg)" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="50" y="50" width="800" height="6" rx="3" fill="url(#accent)"/>

  <text x="50%" y="82" text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="16" font-weight="700" letter-spacing="2"
        fill="url(#accent)">FRONT-END DEVELOPMENT</text>

  <text x="50%" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6edf3">One of my favorite parts of software development is front-</text><text x="50%" y="139" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6edf3">end development. I enjoy working on websites and mobile</text><text x="50%" y="173" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6edf3">applications, combining creativity with problem-solving to</text><text x="50%" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6edf3">build clean and engaging user experiences.</text>
</svg>
